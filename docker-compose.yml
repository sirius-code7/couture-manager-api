services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: couture_manager
      POSTGRES_USER: ${POSTGRES_USER:-couture_manager_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-couture_manager_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-couture_manager_user} -d couture_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Couture Manager API
      APP_DESCRIPTION: API de gestion d'un atelier de couture.
      APP_VERSION: 1.0.0
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-couture_manager_user}:${POSTGRES_PASSWORD:-couture_manager_dev}@db:5432/couture_manager
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?La variable JWT_SECRET_KEY doit etre definie dans .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"

volumes:
  postgres_data:
